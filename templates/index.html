<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<div class="bg-grid"></div>

<div class="app">

  <!-- Header -->
  <header class="header" id="header">
    <div class="logo">
      <span class="logo-ring"></span>
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="3" fill="white"/>
      </svg>
    </div>
    <div class="title">
      <h1>AI Assistant</h1>
      <span>Powered by LLM</span>
    </div>
    <div class="status">
      <span class="dot"></span>
      Online
    </div>
  </header>

  <!-- Chat -->
  <main class="chat" id="chat">

    <div class="row ai">
      <div class="avatar">🤖</div>
      <div class="bubble">Hi! How can I help?</div>
    </div>

    <div class="row user">
      <div class="avatar">👤</div>
      <div class="bubble">Hello!</div>
    </div>

    <div class="row ai">
      <div class="avatar">🤖</div>
      <div class="bubble">Hi! How can I help?</div>
    </div>

  </main>

  <!-- Typing indicator (hidden by default) -->
  <div class="typing-row" id="typingRow" hidden>
    <div class="avatar">🤖</div>
    <div class="bubble typing-bubble">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Input -->
  <footer class="input-area">
    <div class="input-wrap">
      <textarea id="messageInput" rows="1" placeholder="Type a message..."></textarea>
    </div>
    <button id="sendBtn" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="white"/>
      </svg>
    </button>
  </footer>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
