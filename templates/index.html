<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<div class="bg-grid"></div>

<div class="app">

  <!-- Header -->
  <header class="header" id="header">
    <div class="logo">
      <span class="logo-ring"></span>
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="3" fill="white"/>
      </svg>
    </div>

    <div class="title">
      <h1>AI Assistant</h1>
      <span id="headerSubtitle">Powered by LLM</span>
    </div>

    <div class="status">
      <span class="dot"></span>
      Online
    </div>
  </header>

  <!-- Document / RAG panel -->
  <section class="doc-panel" id="docPanel">

    <!-- Empty state: drop zone -->
    <div class="doc-dropzone" id="docDropzone">
      <input type="file" id="documentInput" accept=".docx,.pdf" hidden />

      <svg class="doc-dropzone-icon" viewBox="0 0 24 24" fill="none">
        <path d="M12 4v11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M7.5 9.5L12 5l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.5 16.5v2A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>

      <div class="doc-dropzone-text">
        <strong>Add a document</strong>
        <span>Drop a PDF or DOCX here, or click to browse — ask questions about its contents</span>
      </div>

      <button id="uploadBtn" type="button" class="doc-btn doc-btn-primary">
        Upload Document
      </button>
    </div>

    <!-- Loaded state: document card -->
    <div class="doc-card" id="docCard" hidden>
      <div class="doc-card-icon">📄</div>

      <div class="doc-card-info">
        <strong id="docName">document.pdf</strong>
        <span id="docMeta">0 chunks · 0 tokens</span>
      </div>

      <button id="removeDocBtn" class="doc-btn doc-btn-ghost" type="button" title="Remove document">
        Remove
      </button>
    </div>

    <!-- Token limit bar -->
    <div class="token-bar-wrap" title="Approximate tokens used in the last request, out of the model's context window">
      <div class="token-bar-labels">
        <span id="tokenLabel">0 / 0 tokens</span>
        <span id="tokenPercent">0%</span>
      </div>
      <div class="token-bar-track">
        <div class="token-bar-fill" id="tokenBarFill"></div>
      </div>
    </div>

  </section>

  <!-- Chat -->
  <main class="chat" id="chat">

    <div class="row ai">
      <div class="avatar">🤖</div>
      <div class="bubble">Hi! Upload a document above and ask me anything about it, or just chat with me directly.</div>
    </div>

  </main>

  <!-- Typing indicator -->
  <div class="typing-row" id="typingRow" hidden>
    <div class="avatar">🤖</div>
    <div class="bubble typing-bubble">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Input -->
  <footer class="input-area">
    <div class="input-wrap">
      <textarea
        id="messageInput"
        rows="1"
        placeholder="Type a message..."
      ></textarea>
    </div>

    <button id="sendBtn" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="white"/>
      </svg>
    </button>
  </footer>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
